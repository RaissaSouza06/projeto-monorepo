name: Monorepo CI Pipeline

on:
  # Dispara automaticamente ao enviar novos commits para a branch main
  push:
    branches:
      - main
  # Dispara abertura ou atualização de prdirecionados para a branch main
  pull_request:
    branches:
      - main
  # Permite execução manual pelo painel web do github actions
  workflow_dispatch:

# permite cancelar execuções anteriores na mesma branch se novos commits forem enviados
concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  # Job 1: validações estática e testes unitários rápidos (fail-fast)
  validacoes-e-testes:
    name: 1. Qualidade,  Tipos e Testes Unitários
    runs-on: ubunto-latest

    steps:
      - name: 1. Baixar o código-fonte
        uses: actions/checkout@v4

      - name: 2. Habilitar o pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 3. Configurar o Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 4. Instalar Dependencias do Backend
        run: |
          cd backend
          pnpm install --frozen-lockfile

      - name: 5. Validar Padronização com Código (ESLint)
        run: |
          cd backend
          pnpm run lint

      - name: 7. Checagem de Tipos no Backend (tsc --noEmit)
        run: |
          cd backend
          pnpm run type-check

      - name: 8. Executar Testes Unitários com o Vitest
        run: |
          cd backend
          pnpm run test:run
        
# Job 2. Compilação de Produção e Imagem Docker (só executa se o job 1 passar)
  build-e-docker:
    name: 2. Compilação e Imagens Docker
    needs: validacoes-e-testes
    runs-on: ubunto-latest

    steps:
      - name: 1. Baixar o código-fonte
        uses: actions/checkout@v4

      - name: 2. Habilitar o pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 3. Configurar o Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 4. Instalar Dependencias do Backend
        run: |
          cd backend
          pnpm install --frozen-lockfile

      - name: 5. Validar Tipos e Compilar o Backend (Express)
        run: |
          cd backend
          pnpm run build

      - name: 6. Validar Construção da Imagem Docker da API
        run: |
          docker build -t api-services:test ./backend

      - name: 7. Validar frotend (quando presente no monorepo)
        run: |
          if [ -d "app"]; then
            echo "Subprojeto frotend encontrado. Iniciando validação..."
            cd app
            pnpm install --frozen-lockfile
            pnpm run build
            docker build -t app-services.test ./app
          else
            echo "Subprojeto ainda não adicionado ao monorepo"
          fi
      
      - name: 8. Resumo da Execução
        run: |
          echo "### Resumo da Execução do Pipeline do CI" >> $GITHUB_STEP_SUMMARY
          echo "Integração Contínua concluída com sucesso" >> $GITHUB_STEP_SUMMARY
          echo "Autor: ${{github.actor}}" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{github.sha}}" >> $GITHUB_STEP_SUMMARY